# Production (Linux): join an EXISTING macvlan network (e.g. the one Node-RED
# already uses). Use this instead of docker-compose.macvlan.yml when Docker
# reports "Pool overlaps with other one on this address space" — that error
# means a macvlan network for this subnet already exists, so join it rather
# than creating a second one.
#
#   1. Find the network name:  docker network ls   (driver "macvlan")
#   2. Set MACVLAN_NETWORK to that name, MACVLAN_IP to a free IP on its subnet
#   3. docker compose -f docker-compose.macvlan-external.yml up -d --build
#
# NODE_RED_URL should be Node-RED's macvlan IP (container DNS names are not
# reliable across separately-created stacks on macvlan).

services:
  node-red-mcp:
    build: .
    # Local tag by default. For GHCR: IMAGE_NAME=ghcr.io/adub08/node-red-mcp:2.0.0
    image: ${IMAGE_NAME:-node-red-mcp:2.0.0}
    restart: unless-stopped
    # No `ports:` — traffic hits MACVLAN_IP:MCP_HTTP_PORT on the LAN.
    volumes:
      - node-red-mcp-data:/data
    environment:
      NODE_RED_URL: ${NODE_RED_URL}
      NODE_RED_TOKEN: ${NODE_RED_TOKEN:-}
      NR_MCP_ENCRYPTION_KEY: ${NR_MCP_ENCRYPTION_KEY:-}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-3000}
      # Set MCP_PUBLIC_HOST to MACVLAN_IP (or a DNS name pointing at it).
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST}
      MCP_PUBLIC_PORT: ${MCP_PUBLIC_PORT:-3000}
      # Optional Cloudflare Access origin validation:
      # CF_ACCESS_TEAM_DOMAIN: yourteam.cloudflareaccess.com
      # CF_ACCESS_AUD: your-access-aud-tag
    networks:
      lan:
        ipv4_address: ${MACVLAN_IP}

volumes:
  node-red-mcp-data:

networks:
  lan:
    external: true
    name: ${MACVLAN_NETWORK}
